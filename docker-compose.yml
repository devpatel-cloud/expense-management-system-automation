services:

  postgres:
    image: postgres:16
    container_name: expense_postgres
    restart: always

    environment:
      POSTGRES_DB: expense_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d expense_management"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - expense_network


  backend:
    build:
      context: ./backend

    container_name: expense_backend

    restart: always

    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/expense_management
      SECRET_KEY: your_super_secret_key_change_this_in_production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "8000:8000"

    networks:
      - expense_network


  frontend:
    build:
      context: ./frontend

    container_name: expense_frontend

    restart: always

    depends_on:
      - backend

    ports:
      - "3000:80"

    networks:
      - expense_network


  nginx:
    build:
      context: ./nginx

    container_name: expense_nginx

    restart: always

    depends_on:
      - frontend
      - backend

    ports:
      - "80:80"

    networks:
      - expense_network


volumes:
  postgres_data:


networks:
  expense_network: